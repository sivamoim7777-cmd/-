<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입사주식 - 청소년 모의 투자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA;
  --surface:#FFFFFF;
  --surface-2:#EEF1F7;
  --border:#DDE3ED;
  --mint:#0E9F6E;
  --mint-dim:#E4F7EE;
  --gold:#B7791F;
  --up:#E0332F;       /* 상승 = 빨강 */
  --down:#0E9F4E;      /* 하락 = 초록 */
  --text:#131A29;
  --muted:#5B6478;
  --faint:#8A93A6;
  --shadow:0 2px 10px rgba(20,30,50,.05);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans KR', sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
.num{font-family:'JetBrains Mono', monospace;}
.disp{font-family:'Space Grotesk', sans-serif;}
button{font-family:inherit; cursor:pointer; border:none;}
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

#app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column;}

/* ---------- 랜딩 ---------- */
.landing{padding:36px 22px 100px;}
.landing-hero{margin-bottom:28px;}
.landing-badge{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--mint-dim); color:var(--mint); font-size:11px; font-weight:700;
  padding:5px 10px; border-radius:20px; letter-spacing:.3px; margin-bottom:16px;
}
.landing-badge::before{content:'●'; font-size:8px;}
.landing h1{
  font-family:'Space Grotesk', sans-serif; font-size:32px; font-weight:700; line-height:1.3;
  letter-spacing:-.5px;
}
.landing h1 em{font-style:normal; color:var(--mint);}
.landing p.sub{color:var(--muted); font-size:14px; margin-top:12px; line-height:1.6;}
.capital-strip{
  margin-top:22px; background:linear-gradient(135deg,var(--surface-2),var(--surface));
  border:1px solid var(--border); box-shadow:var(--shadow); border-radius:16px; padding:18px 20px;
  display:flex; justify-content:space-between; align-items:center;
}
.capital-strip .lbl{font-size:12px; color:var(--muted);}
.capital-strip .val{font-family:'Space Grotesk'; font-size:22px; font-weight:700; color:var(--mint); margin-top:4px;}
.section-lbl{
  font-size:12px; font-weight:700; color:var(--faint); letter-spacing:1px; text-transform:uppercase;
  margin:30px 0 14px;
}
.company-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.company-card{
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:16px; padding:16px;
  text-align:left; transition:transform .15s, border-color .15s; position:relative; overflow:hidden;
}
.company-card:active{transform:scale(.97);}
.company-card:hover{border-color:var(--mint);}
.company-logo{
  width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk'; font-weight:700; font-size:19px; color:#0B1120; margin-bottom:10px;
}
.company-card .cname{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.company-card .csector{font-size:11.5px; color:var(--muted); margin-top:2px;}
.company-card .cprice{font-family:'JetBrains Mono'; font-size:11px; color:var(--faint); margin-top:8px;}

/* ---------- 입사 모달 ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(5,8,16,.75); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal{
  background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:20px; padding:28px 24px;
  max-width:340px; width:100%; text-align:center; animation:popIn .28s cubic-bezier(.2,1.4,.4,1);
}
@keyframes popIn{from{opacity:0; transform:scale(.85) translateY(10px)} to{opacity:1; transform:scale(1) translateY(0)}}
.modal .company-logo{margin:0 auto 14px;}
.modal h3{font-size:18px; font-weight:700;}
.modal p{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.6;}
.modal-actions{display:flex; gap:8px; margin-top:22px;}
.btn{
  flex:1; padding:13px; border-radius:12px; font-weight:700; font-size:14px; transition:opacity .15s;
}
.btn:active{opacity:.7;}
.btn-primary{background:var(--mint); color:#FFFFFF;}
.btn-ghost{background:var(--surface-2); color:var(--muted);}

/* ---------- 사원증 발급 애니메이션 ---------- */
.badge-reveal{display:flex; flex-direction:column; align-items:center; padding:10px 0 4px;}
.id-card{
  width:220px; background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--border); box-shadow:var(--shadow); border-radius:18px; padding:20px 18px; position:relative;
  box-shadow:0 20px 40px -12px rgba(0,0,0,.6); animation:cardDrop .5s cubic-bezier(.2,1.5,.4,1);
}
@keyframes cardDrop{from{opacity:0; transform:translateY(-30px) rotate(-6deg)} to{opacity:1; transform:translateY(0) rotate(0)}}
.id-card::before{
  content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  width:36px; height:14px; border:2px solid var(--faint); border-bottom:none; border-radius:10px 10px 0 0;
}
.id-card .co{font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase;}
.id-card .logo-lg{width:44px; height:44px; border-radius:12px; margin:10px 0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:22px; color:#0B1120;}
.id-card .name{font-weight:700; font-size:15px;}
.id-card .role{font-size:12px; color:var(--gold); font-weight:700; margin-top:2px;}
.id-card .idno{font-family:'JetBrains Mono'; font-size:10px; color:var(--faint); margin-top:12px;}

/* ---------- 상단바 / 티커 ---------- */
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border); padding:14px 18px 0;
  position:sticky; top:0; z-index:20;
}
.topbar-row{display:flex; align-items:center; justify-content:space-between;}
.mini-id{display:flex; align-items:center; gap:9px;}
.mini-id .logo-sm{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:15px; color:#0B1120;}
.mini-id .who{font-size:12.5px;}
.mini-id .who b{font-weight:700; display:block; font-size:13px;}
.mini-id .who span{color:var(--gold); font-size:10.5px; font-weight:700;}
.asset-tag{text-align:right;}
.asset-tag .lbl{font-size:9.5px; color:var(--muted);}
.asset-tag .val{font-family:'JetBrains Mono'; font-weight:700; font-size:15px;}
.ticker-wrap{overflow:hidden; margin:12px -18px 0; border-top:1px solid var(--border); background:var(--bg);}
.ticker-track{display:flex; width:max-content; animation:scrollTicker 28s linear infinite; padding:8px 0;}
@keyframes scrollTicker{from{transform:translateX(0)} to{transform:translateX(-50%)}}
.ticker-item{display:flex; align-items:center; gap:6px; padding:0 16px; font-family:'JetBrains Mono'; font-size:11px; white-space:nowrap; border-right:1px solid var(--border);}
.ticker-item .tname{color:var(--muted); font-family:'Noto Sans KR';}

/* ---------- 탭바 ---------- */
.tabbar{
  display:flex; background:var(--surface); border-top:1px solid var(--border);
  position:sticky; bottom:0; z-index:20; padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1; padding:10px 2px 9px; text-align:center; color:var(--faint); font-size:9.5px; font-weight:700; white-space:nowrap;}
.tab .ic{font-size:16px; display:block; margin-bottom:2px;}
.tab.active{color:var(--mint);}

.screen{flex:1; padding:18px 18px 26px; overflow-y:auto;}

/* ---------- 홈 ---------- */
.hero-card{
  background:linear-gradient(135deg,var(--surface-2),var(--surface)); border:1px solid var(--border);
  border-radius:18px; padding:22px; margin-bottom:18px;
}
.hero-card .lbl{font-size:12px; color:var(--muted);}
.hero-card .total{font-family:'Space Grotesk'; font-size:30px; font-weight:700; margin-top:6px;}
.hero-card .change{font-family:'JetBrains Mono'; font-size:13px; margin-top:6px; font-weight:700;}
.up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--muted);}
.rank-progress{margin-top:18px;}
.rank-progress .rr{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:6px;}
.bar-bg{height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--mint)); border-radius:4px; transition:width .4s;}

.stat-row{display:flex; gap:10px; margin-bottom:18px;}
.stat-box{flex:1; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:14px;}
.stat-box .lbl{font-size:11px; color:var(--muted);}
.stat-box .val{font-family:'JetBrains Mono'; font-weight:700; font-size:15px; margin-top:5px;}

.holding-mini{display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
.holding-mini .left{display:flex; align-items:center; gap:10px;}
.holding-mini .logo-xs{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:14px; color:#0B1120; flex-shrink:0;}
.holding-mini .nm{font-size:13px; font-weight:700;}
.holding-mini .qty{font-size:10.5px; color:var(--muted);}
.holding-mini .right{text-align:right;}
.holding-mini .pl{font-family:'JetBrains Mono'; font-size:12.5px; font-weight:700;}
.empty-note{color:var(--faint); font-size:12.5px; text-align:center; padding:22px 10px; border:1px dashed var(--border); border-radius:12px;}

/* ---------- 시장/종목 리스트 ---------- */
.stock-row{
  display:flex; align-items:center; justify-content:space-between; background:var(--surface);
  border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:13px 14px; margin-bottom:9px;
}
.stock-row .left{display:flex; align-items:center; gap:11px; min-width:0;}
.stock-row .info .nm{font-size:13.5px; font-weight:700;}
.stock-row .info .sec{font-size:10.5px; color:var(--muted);}
.spark{width:64px; height:28px; flex-shrink:0;}
.stock-row .right{text-align:right; flex-shrink:0; margin-left:8px;}
.stock-row .price{font-family:'JetBrains Mono'; font-weight:700; font-size:13.5px;}
.stock-row .chg{font-family:'JetBrains Mono'; font-size:11px; margin-top:2px;}

/* ---------- 종목 상세 ---------- */
.detail-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.back-btn{background:var(--surface); border:1px solid var(--border); width:34px; height:34px; border-radius:10px; color:var(--text); font-size:16px;}
.detail-price{font-family:'Space Grotesk'; font-size:28px; font-weight:700; margin:14px 0 4px;}
.chart-box{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:16px; padding:14px; margin-bottom:16px;}
.trade-panel{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:16px; padding:16px; margin-bottom:14px;}
.trade-tabs{display:flex; gap:8px; margin-bottom:14px;}
.ttab{flex:1; padding:9px; border-radius:10px; font-weight:700; font-size:13px; background:var(--surface-2); color:var(--muted);}
.ttab.on-buy{background:var(--up); color:#fff;}
.ttab.on-sell{background:var(--down); color:#fff;}
.qty-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.qty-btn{width:38px; height:38px; border-radius:10px; background:var(--surface-2); color:var(--text); font-size:18px; font-weight:700;}
.qty-input{flex:1; text-align:center; background:var(--surface-2); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:10px; padding:9px; color:var(--text); font-family:'JetBrains Mono'; font-size:15px; font-weight:700;}
.trade-summary{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:14px;}
.trade-summary b{color:var(--text); font-family:'JetBrains Mono';}
.confirm-btn{width:100%; padding:14px; border-radius:12px; font-weight:700; font-size:14.5px; color:#fff;}
.msg-toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--surface-2);
  border:1px solid var(--border); padding:11px 20px; border-radius:30px; font-size:12.5px; font-weight:700;
  z-index:60; animation:toastIn .25s ease; max-width:88%; text-align:center;
}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)}}

/* ---------- 거래내역 ---------- */
.tx-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
.tx-row .tag{font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; margin-right:8px;}
.tag-buy{background:rgba(255,82,82,.15); color:var(--up);}
.tag-sell{background:rgba(76,141,255,.15); color:var(--down);}
.tx-row .nm{font-size:13px; font-weight:700; display:inline;}
.tx-row .meta{font-size:10.5px; color:var(--muted); margin-top:3px;}
.tx-row .reason{font-size:11.5px; color:var(--text); margin-top:5px; line-height:1.5; max-width:220px;}
.tx-row .amt{font-family:'JetBrains Mono'; font-weight:700; font-size:13px;}

/* ---------- 랭킹 ---------- */
.rank-hero{text-align:center; padding:20px 10px 8px;}
.rank-hero .logo-lg{margin:0 auto 12px;}
.rank-hero .title{font-size:20px; font-weight:700;}
.rank-hero .desc{font-size:12px; color:var(--muted); margin-top:4px;}
.ladder{margin-top:20px;}
.ladder-item{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; margin-bottom:6px;}
.ladder-item.current{background:var(--mint-dim); border:1px solid var(--mint);}
.ladder-item .lv-ic{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:var(--surface-2); flex-shrink:0;}
.ladder-item.current .lv-ic{background:var(--mint); color:#FFFFFF;}
.ladder-item .lv-name{font-size:13px; font-weight:700;}
.ladder-item .lv-req{font-size:10.5px; color:var(--muted);}
.leader-list{margin-top:8px;}
.leader-row{display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--border);}
.leader-row.me{background:var(--mint-dim); border-radius:10px; padding:11px 10px; border-bottom:none; margin:4px 0;}
.leader-row .lrank{font-family:'Space Grotesk'; font-weight:700; width:26px; color:var(--faint);}
.leader-row .lname{font-size:13px; font-weight:700; flex:1; margin-left:6px;}
.leader-row .lval{font-family:'JetBrains Mono'; font-size:12.5px; font-weight:700;}

/* ---------- 학습(용어사전 / 출석퀴즈) ---------- */
.subnav{display:flex; gap:8px; margin-bottom:18px;}
.subnav-btn{flex:1; padding:11px; border-radius:12px; font-weight:700; font-size:12.5px; background:var(--surface); border:1px solid var(--border); color:var(--muted);}
.subnav-btn.active{background:var(--mint); border-color:var(--mint); color:#fff;}

.term-card{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
.term-card .tname{font-weight:700; font-size:14px; color:var(--mint);}
.term-card .tdef{font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.55;}

.date-setter{display:flex; gap:8px; align-items:flex-end; margin-bottom:16px;}
.date-field{flex:1;}
.date-field label{font-size:11px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600;}
.date-field input{width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-family:'JetBrains Mono'; font-size:14px; text-align:center; color:var(--text);}
.date-apply-btn{padding:0 18px; height:40px; border-radius:10px; background:var(--mint); color:#fff; font-weight:700; font-size:12.5px; white-space:nowrap;}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:10.5px; color:var(--faint); font-weight:700; padding-bottom:2px;}
.cal-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:9px; font-family:'JetBrains Mono'; font-size:11.5px; background:var(--surface-2); color:var(--faint); border:1.5px solid transparent;}
.cal-cell.empty{background:transparent;}
.cal-cell.stamped{background:var(--mint-dim); color:var(--mint); font-weight:700;}
.cal-cell.current{border-color:var(--mint); color:var(--text); font-weight:700; background:var(--surface);}

.complete-banner{background:var(--mint-dim); border:1px solid var(--mint); border-radius:16px; padding:22px; text-align:center;}

.quiz-card{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:16px; padding:20px;}
.quiz-q{font-size:14px; font-weight:700; line-height:1.6; margin-bottom:16px;}
.quiz-choice{display:block; width:100%; text-align:left; padding:13px 14px; border-radius:12px; background:var(--surface-2); border:1.5px solid var(--border); margin-bottom:9px; font-size:13.5px; font-weight:600; color:var(--text); transition:.15s;}
.quiz-choice.correct{background:var(--mint-dim); border-color:var(--mint); color:var(--mint);}
.quiz-choice.wrong{background:#FDE8E8; border-color:var(--up); color:var(--up);}
.quiz-choice:disabled{opacity:.85;}

/* ---------- 뉴스 ---------- */
.news-disclaimer{font-size:11px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:11px 13px; line-height:1.55; margin-bottom:16px;}
.news-card{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:16px; padding:17px; margin-bottom:12px;}
.news-meta{font-size:10.5px; color:var(--faint); font-weight:700; letter-spacing:.3px;}
.news-title{font-size:15px; font-weight:700; margin-top:6px; line-height:1.4;}
.news-body{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.6;}
.ai-btn{width:100%; margin-top:13px; padding:11px; border-radius:11px; background:var(--surface-2); border:1px solid var(--border); color:var(--mint); font-weight:700; font-size:12.5px;}
.ai-btn:disabled{opacity:.6;}
.ai-out{margin-top:12px; background:var(--mint-dim); border:1px solid var(--mint); border-radius:12px; padding:13px 14px;}
.ai-badge{font-size:10.5px; font-weight:700; color:var(--mint); margin-bottom:6px;}
.ai-text{font-size:12.5px; color:var(--text); line-height:1.6; white-space:pre-wrap;}
.ai-loading{font-size:12.5px; color:var(--muted);}
.ai-error{font-size:12px; color:var(--up);}

/* ---------- 투자 게시판 ---------- */
.board-compose{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:14px; margin-bottom:16px;}
.board-compose textarea{width:100%; min-height:60px; resize:vertical; border:1px solid var(--border); border-radius:10px; padding:10px; font-family:inherit; font-size:13px; color:var(--text); background:var(--surface-2); line-height:1.5;}
.board-compose-btn{width:100%; margin-top:9px; padding:11px; border-radius:11px; background:var(--mint); color:#fff; font-weight:700; font-size:13px;}
.board-post{background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:16px; padding:16px; margin-bottom:12px;}
.board-post .bp-head{display:flex; align-items:center; gap:9px;}
.board-post .bp-who{font-size:13px; font-weight:700;}
.board-post .bp-time{font-size:10.5px; color:var(--faint); margin-left:auto;}
.board-post .bp-tag{font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; margin-top:6px; display:inline-block;}
.board-post .bp-text{font-size:13px; color:var(--text); margin-top:9px; line-height:1.6; white-space:pre-wrap;}
.board-post .bp-comments{margin-top:12px; border-top:1px solid var(--border); padding-top:10px;}
.board-post .bp-comment{font-size:12px; color:var(--muted); margin-bottom:6px; line-height:1.5;}
.board-post .bp-comment b{color:var(--text);}
.board-post .bp-comment-row{display:flex; gap:8px; margin-top:8px;}
.board-post .bp-comment-row input{flex:1; border:1px solid var(--border); border-radius:9px; padding:8px 10px; font-size:12px; background:var(--surface-2); color:var(--text);}

function genInitialCandles(base){
  const candles = [];
  let prevClose = base * (1 - (Math.random()*0.06));
  for(let i=0;i<26;i++){
    const open = prevClose;
    const drift = (Math.random()-0.48) * 0.025;
    const close = Math.max(open*(1+drift), base*0.2);
    const high = Math.max(open,close) * (1 + Math.random()*0.012);
    const low = Math.min(open,close) * (1 - Math.random()*0.012);
    const vol = Math.round(300000 + Math.random()*1200000);
    candles.push({o:open,h:high,l:low,c:close,v:vol});
    prevClose = close;
  }
  return candles;
}

function reasonFor(c, chg){
  const r = REASONS[c.id];
  if(!r) return null;
  if(chg >= 3) return r.upBig;
  if(chg >= 0.5) return r.up;
  if(chg <= -3) return r.downBig;
  if(chg <= -0.5) return r.down;
  return r.flat;
}

function totalAsset(){
  let v = state.cash;
  Object.keys(state.holdings).forEach(id=>{
    v += state.holdings[id].qty * state.stocks[id].price;
  });
  return v;
}
function roi(){
  if(!state.company) return 0;
  return ((totalAsset()-INIT_CAPITAL)/INIT_CAPITAL)*100;
}
function currentRank(){
  const r = roi();
  let cur = RANKS[0];
  for(const rk of RANKS){ if(r>=rk.min) cur=rk; }
  return cur;
}
function nextRank(){
  const idx = RANKS.findIndex(r=>r.key===currentRank().key);
  return RANKS[idx+1] || null;
}

/* ============ 가격 시뮬레이션 (캔들 기반) ============ */
setInterval(()=>{
  if(state.screen!=='dashboard') return;
  COMPANIES.forEach(c=>{
    const s = state.stocks[c.id];
    const cur = s.candles[s.candles.length-1];
    const vol = 0.004 + Math.random()*0.012;
    const dir = Math.random()<0.5? -1:1;
    let np = s.price * (1 + dir*vol);
    np = Math.max(np, c.base*0.3);

    s.tickCount++;
    if(s.tickCount >= CANDLE_TICKS){
      // 새 봉(캔들) 시작
      s.tickCount = 0;
      s.candles.push({o:cur.c, h:np, l:np, c:np, v:Math.round(200000+Math.random()*1300000)});
      if(s.candles.length>30) s.candles.shift();
    } else {
      // 현재 봉 갱신
      cur.c = np;
      cur.h = Math.max(cur.h, np);
      cur.l = Math.min(cur.l, np);
      cur.v += Math.round(Math.random()*80000);
    }
    s.price = np;
  });
  // 수량/이유/날짜/게시판 글쓰기 입력창에 타이핑 중이면 전체 재렌더를 건너뛰어
  // 입력 중인 값이 지워지거나 커서가 끊기지 않게 한다
  const activeId = document.activeElement && document.activeElement.id;
  const typingQty = activeId === 'qtyInput';
  const typingAttDate = activeId === 'monthInput' || activeId === 'dayInput';
  const typingFreeText = activeId === 'reasonInput' || activeId === 'boardDraftInput' || (activeId && activeId.indexOf('commentInput_')===0);
  if(typingQty){
    updateTradeSummary();
  } else if(typingAttDate || typingFreeText){
    // 아무것도 하지 않음: 입력 중에는 화면을 그대로 둔다
  } else {
    render();
  }
}, 2200);

function render(){
  const app = document.getElementById('app');
  // 입력 중인 수량 인풋의 포커스/커서 위치를 재렌더 후 복원하기 위해 기억해둔다
  const activeIsQty = document.activeElement && document.activeElement.id === 'qtyInput';
  const selStart = activeIsQty ? document.activeElement.selectionStart : null;

  if(state.screen==='landing'){
    app.innerHTML = renderLanding();
  } else {
    app.innerHTML = renderTopbar() + renderScreenBody() + renderTabbar();
  }
  if(state.pendingCompany){
    app.innerHTML += renderModal();
  }
  if(state.toast){
    app.innerHTML += `<div class="msg-toast">${state.toast}</div>`;
  }

  if(activeIsQty){
    const el = document.getElementById('qtyInput');
    if(el){
      el.focus();
      try{ el.setSelectionRange(selStart, selStart); }catch(e){}
    }
  }
}

function sparkline(hist, color){
  const w=64,h=28, min=Math.min(...hist), max=Math.max(...hist), range=(max-min)||1;
  const pts = hist.map((v,i)=> `${(i/(hist.length-1))*w},${h-((v-min)/range)*h}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function candleChart(candles){
  const w=320, h=170, volH=36, gap=4;
  const bodyW = Math.max(3, (w/candles.length) - gap);
  const allHigh = Math.max(...candles.map(k=>k.h));
  const allLow = Math.min(...candles.map(k=>k.l));
  const range = (allHigh-allLow) || 1;
  const maxVol = Math.max(...candles.map(k=>k.v)) || 1;
  const priceY = v => 8 + (1 - (v-allLow)/range) * (h-16);

  const grid = [0,0.5,1].map(t=>{
    const y = 8 + t*(h-16);
    const val = allHigh - t*range;
    return `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#E2E8F0" stroke-width="1"/>
      <text x="${w-2}" y="${y-3}" text-anchor="end" font-size="9" fill="#94A3B8" font-family="JetBrains Mono">${fmt(val)}</text>`;
  }).join('');

  const bars = candles.map((k,i)=>{
    const x = i*(bodyW+gap) + gap/2;
    const cx = x + bodyW/2;
    const up = k.c >= k.o;
    const color = up ? '#E0332F' : '#0E9F4E';
    const yHigh = priceY(k.h), yLow = priceY(k.l);
    const yOpen = priceY(k.o), yClose = priceY(k.c);
    const bodyTop = Math.min(yOpen,yClose), bodyBot = Math.max(yOpen,yClose);
    const bodyH = Math.max(1.5, bodyBot-bodyTop);
    const vBarH = (k.v/maxVol) * (volH-4);
    return `
      <line x1="${cx}" y1="${yHigh}" x2="${cx}" y2="${yLow}" stroke="${color}" stroke-width="1.4"/>
      <rect x="${x}" y="${bodyTop}" width="${bodyW}" height="${bodyH}" fill="${color}" rx="1"/>
      <rect x="${x}" y="${h+8+(volH-4-vBarH)}" width="${bodyW}" height="${vBarH}" fill="${color}" opacity="0.45" rx="1"/>
    `;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h+volH+10}" style="width:100%; height:${h+volH+10}px;">
    ${grid}
    ${bars}
    <line x1="0" y1="${h+6}" x2="${w}" y2="${h+6}" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="${h+volH+8}" font-size="9" fill="#94A3B8" font-family="JetBrains Mono">거래량</text>
  </svg>`;
}

function renderAttendanceQuiz(){
  const {year, month, day} = state.att;
  const key = attKey(year, month);
  const stampedArr = state.att.stamped[key] || [];
  const dim = daysInMonth(year, month);
  const firstDow = firstWeekday(year, month);
  const isTodayStamped = stampedArr.includes(day);
  const allDone = stampedArr.length >= dim;

  if(!isTodayStamped && !allDone && !state.quiz){
    state.quiz = generateQuizObj();
  }

  const weekdayLbls = ['일','월','화','수','목','금','토'];
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=dim; d++){
    const stamped = stampedArr.includes(d);
    const isCur = d===day;
    cells += `<div class="cal-cell ${stamped?'stamped':''} ${isCur?'current':''}">${stamped?'✅':d}</div>`;
  }

  return `
    <div class="date-setter">
      <div class="date-field"><label>이번 달(월)</label><input id="monthInput" type="number" min="1" max="12" value="${month}"></div>
      <div class="date-field"><label>오늘(일)</label><input id="dayInput" type="number" min="1" max="${dim}" value="${day}"></div>
      <button class="date-apply-btn" onclick="applyAttDate()">적용</button>
    </div>

    <div class="stat-box" style="margin-bottom:16px;">
      <div class="lbl">${year}년 ${month}월 출석 현황</div>
      <div class="val num" style="margin-top:6px;">${stampedArr.length} / ${dim}일 스탬프 완료</div>
      <div class="bar-bg" style="margin-top:10px;"><div class="bar-fill" style="width:${(stampedArr.length/dim)*100}%"></div></div>
      <div style="font-size:11px; color:var(--muted); margin-top:8px;">퀴즈 정답 시 하루 ${fmt(DAILY_QUIZ_REWARD)}원, 한 달 개근 시 ${fmt(MONTHLY_COMPLETE_REWARD)}원 보너스 지급 💰</div>
    </div>

    <div class="cal-grid" style="margin-bottom:8px;">
      ${weekdayLbls.map(w=>`<div class="cal-dow">${w}</div>`).join('')}
    </div>
    <div class="cal-grid" style="margin-bottom:20px;">${cells}</div>

    ${allDone ? `
      <div class="complete-banner">
        <div style="font-size:30px;">🎉</div>
        <div style="font-weight:700; font-size:15px; margin-top:6px;">${month}월 출석을 모두 채웠어요!</div>

        <button class="btn btn-primary" style="margin-top:14px; width:100%;" onclick="nextAttMonth()">다음 달로 이동 →</button>
      </div>
    ` : isTodayStamped ? `
      <div class="complete-banner">
        <div style="font-size:26px;">✅</div>
        <div style="font-weight:700; font-size:14.5px; margin-top:6px;">오늘의 출석을 완료했어요!</div>

function setLearnView(v){ state.learnView=v; render(); }

function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }        // m: 1~12
function firstWeekday(y,m){ return new Date(y, m-1, 1).getDay(); }      // 0=일 ... 6=토
function attKey(y,m){ return `${y}-${m}`; }

function applyAttDate(){
  const mEl = document.getElementById('monthInput');
  const dEl = document.getElementById('dayInput');
  const m = parseInt(mEl.value,10);
  if(!(m>=1 && m<=12)){
    showToast('1~12월 중에서 다시 골라주세요');
    return;
  }
  const dim = daysInMonth(state.att.year, m);
  const d = parseInt(dEl.value,10);
  if(!(d>=1 && d<=dim)){
    showToast(`${m}월은 ${dim}일까지 있어요. 날짜를 다시 골라주세요`);
    return;
  }
  state.att.month = m;
  state.att.day = d;
  state.quiz = null;
  render();
}

function shuffleArr(arr){ return arr.slice().sort(()=>Math.random()-0.5); }

function generateQuizObj(){
  const idx = Math.floor(Math.random()*TERMS.length);
  const correct = TERMS[idx];
  const others = shuffleArr(TERMS.filter((t,i)=>i!==idx)).slice(0,3);
  const choices = shuffleArr([
    {term:correct.term, isCorrect:true},
    ...others.map(o=>({term:o.term, isCorrect:false}))
  ]);
  return { defText:correct.def, choices, answered:false, correctIdx:choices.findIndex(c=>c.isCorrect), wrongIdx:null };
}

function selectQuizAnswer(i){
  const q = state.quiz;
  if(!q || q.answered) return;
  if(q.choices[i].isCorrect){
    q.answered = true;
    const r = stampToday();
    if(!r.already){
      if(r.monthDone){
        showToast(`오늘 출석 완료 +${fmt(DAILY_QUIZ_REWARD)}원 · 이번 달 개근 보너스 +${fmt(MONTHLY_COMPLETE_REWARD)}원 🎉`);
      } else {
        showToast(`오늘 출석 완료! +${fmt(DAILY_QUIZ_REWARD)}원 지급됐어요`);
      }
    } else {
      render();
    }
  } else {
    q.wrongIdx = i;
    render();
    setTimeout(()=>{ if(state.quiz) state.quiz.wrongIdx=null; render(); }, 700);
  }
}

function stampToday(){
  const key = attKey(state.att.year, state.att.month);
  if(!state.att.stamped[key]) state.att.stamped[key] = [];
  const already = state.att.stamped[key].includes(state.att.day);
  let result = {already, monthDone:false};
  if(!already){
    state.att.stamped[key].push(state.att.day);
    state.cash += DAILY_QUIZ_REWARD;
    const dim = daysInMonth(state.att.year, state.att.month);
    if(state.att.stamped[key].length >= dim && !state.att.monthBonusGiven[key]){
      state.att.monthBonusGiven[key] = true;
      state.cash += MONTHLY_COMPLETE_REWARD;
      result.monthDone = true;
    }
  }
  return result;
}

function nextAttMonth(){
  state.att.month += 1;
  if(state.att.month > 12){ state.att.month = 1; state.att.year += 1; }
  state.att.day = 1;
  state.quiz = null;
  render();
}

function advanceDemoDay(){
  // 데모 체험용: 실제로는 하루가 지나야 다음 스탬프를 찍을 수 있지만,
  // 한 자리에서 흐름을 확인해볼 수 있도록 다음 날짜로 넘어가는 버튼을 제공한다.
  // 이번 달의 마지막 날(예: 8월 31일)에 도달했다면, 다음 날은 다음 달 1일이 되어야 한다.
  const dim = daysInMonth(state.att.year, state.att.month);
  if(state.att.day < dim){
    state.att.day += 1;
  } else {
    state.att.month += 1;
    if(state.att.month > 12){ state.att.month = 1; state.att.year += 1; }
    state.att.day = 1;
  }
  state.quiz = null;
  render();
}

  n3: '원/달러 환율이 1450원대로 떨어졌어요. 환율은 우리 돈과 달러를 바꾸는 비율인데, 환율이 낮아지면 같은 달러를 살 때 우리 돈이 덜 들어서 원화 가치가 그만큼 오른 거예요.',
  n4: '사람들이 요즘 경기를 얼마나 좋게 느끼는지 보여주는 소비자심리지수가 계속 오르고 있어요. 지금 사는 형편과 앞으로 벌 돈에 대한 기대가 둘 다 좋아지고 있다는 뜻이에요.',
  n5: '이번 주에는 미국의 경기 상황을 보여주는 지표(PMI)랑 실업수당 신청 건수, 유럽의 물가지표(CPI) 같은 중요한 발표들이 예정돼 있어요. 이런 지표는 세계 경제가 잘 굴러가는지 가늠하는 온도계 같은 거예요.'
};

function summarizeNews(id){
  const cur = state.newsAI[id];
  if(cur && cur.status==='loading') return;
  state.newsAI[id] = { status:'loading' };
  render();
  // 실제로 생각하는 듯한 느낌을 주기 위해 짧게 기다렸다가 결과를 보여준다.
  setTimeout(()=>{
    const text = NEWS_SUMMARIES[id];
    state.newsAI[id] = text ? { status:'done', text } : { status:'error' };
    render();
  }, 1100 + Math.random()*700);
}
function openStock(id){ state.selectedStock=id; state.tradeMode='buy'; state.tradeQty=1; state.tradeQtyInput=null; state.tradeReason=''; render(); }
function closeStock(){ state.selectedStock=null; render(); }
function setTradeMode(m){ state.tradeMode=m; state.tradeReason=''; render(); }
function changeQty(d){ state.tradeQty = Math.min(MAX_QTY, Math.max(1, state.tradeQty+d)); state.tradeQtyInput=null; render(); }
function setTradeReason(v){
  // 전체 재렌더 없이 상태만 갱신 -> 입력 중 커서가 안정적으로 유지됨
  state.tradeReason = v;
  updateTradeSummary();
}
function setQty(v){
  // 숫자가 아닌 문자는 제거하고, 입력창 DOM 자체는 건드리지 않는다 (재렌더로 인한 커서 튐 방지)
  const digits = v.replace(/[^0-9]/g,'');
  if(digits !== v){
    const el = document.getElementById('qtyInput');
    if(el) el.value = digits;
  }
  state.tradeQtyInput = digits;
  const n = parseInt(digits, 10);
  if(n>0) state.tradeQty = Math.min(n, MAX_QTY);
  updateTradeSummary(); // 전체 재렌더 없이 금액·버튼만 갱신 -> 입력 중 커서가 안정적으로 유지됨
}
function updateTradeSummary(){
  if(!state.selectedStock) return;
  const c = co(state.selectedStock);
  const s = state.stocks[c.id];
  const h = state.holdings[c.id] || {qty:0, avg:0};
  const qty = state.tradeQty;
  const cost = qty * s.price;
  const amtEl = document.getElementById('tradeCostVal');
  if(amtEl) amtEl.textContent = fmt(cost) + '원';
  const hasReason = (state.tradeReason||'').trim().length>0;
  const btn = document.getElementById('confirmBtn');
  if(btn){
    if(state.tradeMode==='buy'){
      const canBuy = state.cash >= cost && hasReason;
      btn.disabled = !canBuy;
      btn.style.opacity = canBuy? '1':'.4';
      btn.textContent = !hasReason ? '매수 이유를 적어주세요' : (state.cash>=cost ? '매수하기' : '현금이 부족해요');
    } else {
      const canSell = h.qty >= qty && hasReason;
      btn.disabled = !canSell;
      btn.style.opacity = canSell? '1':'.4';
      btn.textContent = !hasReason ? '매도 이유를 적어주세요' : (h.qty>=qty ? '매도하기' : '보유 수량이 부족해요');
    }
  }
}
function blurQty(){
  // 입력창을 벗어나면 값을 정리(최소 1)한다.
  // 주의: 여기서 render()로 화면 전체를 다시 그리면, 다른 버튼(매수/매도 등)을 누르는
  // 클릭 도중 blur가 먼저 발생해 그 버튼 자체가 교체되면서 클릭이 씹히는 문제가 생긴다.
  // 그래서 전체 재렌더 없이 입력창 값과 관련 UI만 직접 갱신한다.
  state.tradeQty = Math.min(MAX_QTY, Math.max(1, state.tradeQty||1));
  state.tradeQtyInput = null;
  const el = document.getElementById('qtyInput');
  if(el) el.value = state.tradeQty;
  updateTradeSummary();
}

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 1600);
}

function doTrade(type){
  const id = state.selectedStock;
  const c = co(id);
  const price = state.stocks[id].price;
  const qty = Math.min(state.tradeQty, MAX_QTY);
  const amount = price*qty;
  const reason = (state.tradeReason||'').trim();
  if(!reason) return; // 이유를 적지 않으면 거래할 수 없음
  if(type==='buy'){
    if(state.cash < amount) return;
    state.cash -= amount;
    const h = state.holdings[id] || {qty:0, avg:0};
    const newQty = h.qty+qty;
    const newAvg = (h.avg*h.qty + amount)/newQty;
    state.holdings[id] = {qty:newQty, avg:newAvg};
    state.tx.push({type:'buy', name:c.name, qty, amount, time:nowStr(), reason});
    addBoardPost({type:'buy', companyId:c.id, stockName:c.name, qty, price, reason});
    showToast(`${c.name} ${qty}주 매수 완료`);
  } else {
    const h = state.holdings[id];
    if(!h || h.qty < qty) return;
    h.qty -= qty;
    state.cash += amount;
    state.tx.push({type:'sell', name:c.name, qty, amount, time:nowStr(), reason});
    addBoardPost({type:'sell', companyId:c.id, stockName:c.name, qty, price, reason});
    showToast(`${c.name} ${qty}주 매도 완료`);
  }
  state.tradeQty = 1;
  state.tradeQtyInput = null;
  state.tradeReason = '';
}

render();
</script>
